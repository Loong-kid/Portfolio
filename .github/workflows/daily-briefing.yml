name: daily-briefing
on:
  schedule:
    # UTC 23:00 = next day 08:00 Asia/Seoul, including weekends.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, test message, or deliver today's digest
        type: choice
        options: [preview, test, send, filings-preview, filings-send]
        default: preview
permissions:
  contents: read
concurrency:
  group: daily-briefing-doil
  cancel-in-progress: false
jobs:
  briefing:
    if: vars.BRIEFING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-briefing.txt
      - run: pip install -r scripts/requirements-briefing.txt
      - name: Restore delivery receipts (hashes only)
        id: receipts
        uses: actions/cache/restore@v4
        with:
          path: .briefing-state
          key: briefing-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: briefing-receipts-v1-
      - name: Write read-only Sheets credentials
        env:
          SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/briefing-sa.json"
      - name: Run briefing
        env:
          GOOGLE_SA_JSON: ${{ runner.temp }}/briefing-sa.json
          GOOGLE_SHEET_ID: ${{ secrets.SHEET_ID_DOIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
          SEC_CIK_OVERRIDES: ${{ secrets.SEC_CIK_OVERRIDES || vars.SEC_CIK_OVERRIDES }}
          MODE: ${{ inputs.mode }}
        run: |
          args=()
          [ "$MODE" = preview ] && args+=(--dry-run)
          [ "$MODE" = test ] && args+=(--test)
          [ "$MODE" = filings-preview ] && args+=(--filings-only --dry-run)
          [ "$MODE" = filings-send ] && args+=(--filings-only)
          python scripts/daily_briefing.py "${args[@]}"
      - name: Persist delivery receipts, including partial deliveries
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'filings-send')
        uses: actions/cache/save@v4
        with:
          path: .briefing-state
          key: briefing-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/briefing-sa.json"
